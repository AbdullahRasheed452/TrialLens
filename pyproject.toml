[project]
name = "triallens"
version = "0.1.0"
description = "Evidence-grounded clinical trial eligibility screening with a fine-tuned open-weight LLM"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
